<!DOCTYPE html>
<html>
<head>
<title>Chipped Beef Dip</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
<link rel="stylesheet" href="https://www.w3schools.com/lib/w3-theme-light-green.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.3.0/css/font-awesome.min.css">
<script src="https://code.jquery.com/jquery-1.10.2.js"></script>
</head>

<body>
<!--Navigation bar-->
    <div id="nav-placeholder">
        
        </div>
        
        <script>
        $(function(){
                $("#nav-placeholder").load("/kirk/css/nav_kirk.html");
        });
        </script>
        <!--end of Navigation bar-->

<!-- Header -->
        <!--Header-->
        <div id="header-placeholder">
        
        </div>
        
        <script>
        $(function(){
                $("#header-placeholder").load("/kirk/css/header_kirk.html");
        });
        </script>
        <!--end of header-->



<!-- Recipe Container -->
<div class="w3-container w3-card-4 w3-margin">

<!-- Recipe Name -->
<div class="w3-row">
    <div class="w3-center w3-theme-d1">
     <h1>Chipped Beef Dip</h1>
    </div>
</div>

<!-- First Row -->
    <div class="w3-row">
        <!-- Blank Column -->
        <div class="w3-col m2">
         <br>
        </div>
    
        <!-- Ingredients Column -->
        <div class="w3-col m4 w3-theme-l4">
         <h3>Ingredients:</h3>
         <!-- Delete All Button -->
            <button onclick="clearAllCheckboxes();">Delete All</button>
            
            <p>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">16 oz. Sour Cream</div>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">2 8 oz. Cream Cheese</div>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">1/3 Cup Green Onion</div>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">1/3 Cup Green Pepper</div>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">5 oz. Chipped Beef</div>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">2 - 4 Dash Tabasco</div>
            </p>
        </div>
        <!-- Instructions Column -->
        <div class="w3-col m4 w3-theme-l4">
            <h3>Instructions:</h3>
            <!-- Delete All Button -->
            <button onclick="clearAllCheckboxes();">Delete All</button>
            
             <p>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">1. Preheat oven to 350 degrees.</div>
             <div class="list-todo-container" ><input type="checkbox" class="list-todo">2. Bake uncovered for 30 min.</div>
             </p>
            
        </div>
        
        <!--Blank Column-->
        <div class="w3-col m2">
            <br>
        </div>
        
    </div>
    
    <!-- Image Row -->
    <div class="w3-row">
    <div class="w3-center w3-theme-d1">
     <img src="chipped_beef_dip.jpeg" alt="Chipped Beef Dip" style="width:100%">
    </div>
</div>
    
</div>

    <!--Footer-->
        <div id="footer-placeholder">
        
        </div>
        
        <script>
        $(function(){
                $("#footer-placeholder").load("/kirk/css/footer_kirk.html");
        });
        </script>
        <!--end of Footer-->

<script>
    function clearAllCheckboxes() {
        const checkboxes = document.querySelectorAll('input[type="checkbox"]');
        checkboxes.forEach((checkbox) => {
            checkbox.checked = false;
        });
    }
</script>
<script src="https://code.jquery.com/jquery-1.10.2.js"></script>

</body>
</html>
