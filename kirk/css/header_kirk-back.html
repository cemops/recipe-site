<!-- Keep Screen Awake -->
 <button id="wakeLockButton">Keep Screen Awake</button>

<script>
    let wakeLock = null;

    async function requestWakeLock() {
        try {
            // Ensure any previous wake lock is released
            if (wakeLock !== null) {
                wakeLock.release();
            }
            // Request a new wake lock
            wakeLock = await navigator.wakeLock.request('screen');
            console.log('Wake Lock is active');
        } catch (err) {
            console.error(`${err.name}, ${err.message}`);
        }
    }

    document.getElementById('wakeLockButton').addEventListener('click', () => {
        if (!wakeLock) {
            requestWakeLock();
        }
    });

    document.addEventListener('visibilitychange', async () => {
        if (document.visibilityState === 'visible' && wakeLock === null) {
            await requestWakeLock();
        }
    });

    // Add a release function for when the page is hidden or user closes it
    window.addEventListener('unload', () => {
        if (wakeLock !== null) {
            wakeLock.release();
            wakeLock = null;
        }
    });
</script>
<!-- End Keep Screen Awake -->
