<!DOCTYPE html>
<html>
<head>
  <title>Slow Cooker Beef Short Ribs</title>
  <link rel="stylesheet" href="https://www.w3schools.com/w3css/4/w3.css">
  <style>
    .checkbox-label {
      display: block;
      margin: 8px 0;
    }
    input[type="checkbox"] {
      margin-right: 10px;
    }
  </style>
</head>
<body class="w3-container">

  <header class="w3-center w3-padding-32">
    <h1>Slow Cooker Beef Short Ribs</h1>
    <p><i>Prep Time: 10 min | Total Time: 6 Hr</i></p>
  </header>

  <section class="w3-card w3-padding w3-margin-bottom">
    <h2>Ingredients</h2>
    <label class="checkbox-label"><input type="checkbox"> 1/3 cup flour</label>
    <label class="checkbox-label"><input type="checkbox"> 1 tsp salt</label>
    <label class="checkbox-label"><input type="checkbox"> 1/4 tsp pepper</label>
    <label class="checkbox-label"><input type="checkbox"> 2 1/2 lbs beef short ribs</label>
    <label class="checkbox-label"><input type="checkbox"> 1/4 cup butter</label>
    <label class="checkbox-label"><input type="checkbox"> 1 cup chopped onion</label>
    <label class="checkbox-label"><input type="checkbox"> 1 cup beef broth</label>
    <label class="checkbox-label"><input type="checkbox"> 3/4 cup red wine vinegar</label>
    <label class="checkbox-label"><input type="checkbox"> 1/4 cup brown sugar</label>
    <label class="checkbox-label"><input type="checkbox"> 1/4 cup chili sauce (Szechwan or Sriracha)</label>
    <label class="checkbox-label"><input type="checkbox"> 2 Tbs ketchup</label>
    <label class="checkbox-label"><input type="checkbox"> 2 Tbs Worcestershire sauce</label>
    <label class="checkbox-label"><input type="checkbox"> 2 Tbs minced garlic</label>
    <label class="checkbox-label"><input type="checkbox"> 1 tsp chili powder</label>
  </section>

  <section class="w3-card w3-padding">
    <h2>Instructions</h2>
    <label class="checkbox-label"><input type="checkbox"> Put flour, salt and pepper in a bag</label>
    <label class="checkbox-label"><input type="checkbox"> Add ribs and shake to coat</label>
    <label class="checkbox-label"><input type="checkbox"> Brown ribs in butter in a large skillet</label>
    <label class="checkbox-label"><input type="checkbox"> Put ribs in slow cooker</label>
    <label class="checkbox-label"><input type="checkbox"> In the same skillet, combine remaining ingredients</label>
    <label class="checkbox-label"><input type="checkbox"> Bring to a boil, stirring</label>
    <label class="checkbox-label"><input type="checkbox"> Pour sauce over ribs</label>
    <label class="checkbox-label"><input type="checkbox"> Cover and cook for 5 hours (our hot slow cooker)</label>
  </section>

</body>
</html>
